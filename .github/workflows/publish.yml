name: publish                                                                                                                                                                                                                         
on:                                                                                                                                                                                                                                   
 workflow_dispatch:                                                                                                                                                                                                                  
   inputs:                                                                                                                                                                                                                           
     version-change:                                                                                                                                                                                                                 
       description: Version part                                                                                                                                                                                                     
       required: true                                                                                                                                                                                                                
       type: choice                                                                                                                                                                                                                  
       options:                                                                                                                                                                                                                      
         - PATCH                                                                                                                                                                                                                     
         - MINOR                                                                                                                                                                                                                     
     release-candidate:                                                                                                                                                                                                              
       description: Release candidate                                                                                                                                                                                                
       required: true                                                                                                                                                                                                                
       type: boolean                                                                                                                                                                                                                 
       default: True                                                                                                                                                                                                                 
                                                                                                                                                                                                                                     
permissions:
 contents: write
 id-token: write

jobs:
 publish:                                                                                                                                                                                                                            
   runs-on: ubuntu-latest                                                                                                                                                                                                            
   env:
     VERSION_CHANGE: ${{ github.event.inputs.version-change }}                                                                                                                                                                       
     RELEASE_CANDIDATE: ${{ github.event.inputs.release-candidate }}                                                                                                                                                                 
     VERSION_FILE: src/Ydb.Protos/Ydb.Protos.csproj                                                                                                                                                                                  
     CHANGELOG_FILE: CHANGELOG.md                                                                                                                                                                                                    
     GITHUB_TOKEN: ${{ github.token }}
   steps:                                                                                                                                                                                                                            
     - name: Checkout                                                                                                                                                                                                                
       uses: actions/checkout@v3                                                                                                                                                                                                     
       with:                                                                                                                                                                                                                         
         fetch-depth: 0
         submodules: 'true'                                                                                                                                                                                                          
                                                                                                                                                                                                                                     
     - name: Setup dotnet                                                                                                                                                                                                            
       uses: actions/setup-dotnet@v3                                                                                                                                                                                                 
       with:                                                                                                                                                                                                                         
         dotnet-version: |                                                                                                                                                                                                           
           6.0.x                                                                                                                                                                                                                     
           7.0.x                                                                                                                                                                                                                     
                                                                                                                                                                                                                                     
     - name: Build                                                                                                                                                                                                                   
       run: |                                                                                                                                                                                                                        
         cd src/Ydb.Protos                                                                                                                                                                                                           
         dotnet build --configuration Release                                                                                                                                                                                        
                                                                                                                                                                                                                                     
     - name: NuGet login                                                                                                                                                                                                             
       uses: NuGet/login@v1
       id: nuget-login                                                                                                                                                                                                               
       with:                                                                                                                                                                                                                         
         user: robot-ydb-platform
                                                                                                                                                                                                                                     
     - name: Publish                                                                                                                                                                                                                 
       env:                                                                                                                                                                                                                          
         NUGET_TOKEN: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}                                                                                                                                                                 
       run: bash .github/scripts/publish.sh
